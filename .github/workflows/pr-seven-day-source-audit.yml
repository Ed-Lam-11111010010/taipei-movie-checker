name: Temporary seven-day live source audit
on:
  push:
    paths:
      - ".github/workflows/pr-seven-day-source-audit.yml"
permissions:
  contents: read
jobs:
  source-audit:
    if: github.ref == 'refs/heads/fix/nov12-showtimes-coverage-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/movie-checker-audit/node_modules
    steps:
      - name: Checkout candidate (read-only)
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install parser dependency
        run: npm install --no-save --no-audit --no-fund --prefix /tmp/movie-checker-audit turndown@7.2.0
      - name: Verify parser fixtures
        run: node scripts/sync-showtimes.cjs --self-test
      - name: Fetch all 38 venues (never commit or deploy audit output)
        run: node scripts/sync-showtimes.cjs
      - name: Verify every seven-day source check and publishable rows
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const start=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d.checkedAt));
          const plus=(n)=>new Date(Date.parse(start+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
          const dates=Array.from({length:7},(_,i)=>plus(i));
          assert.equal(d.sources.length,38,'Each expected cinema has an audit');
          assert.equal(d.cinemas.length,38,'All venues retain validated directory presence');
          for(const src of d.sources) {
            assert.equal(src.dateChecks?.length,7,'Missing seven date checks for '+src.cinemaId);
            assert.deepEqual(src.dateChecks.map(x=>x.date),dates,'Wrong audit dates for '+src.cinemaId);
            assert.ok(src.dateChecks.every(x=>['verified','unverified','source_error'].includes(x.state)),
              'Unexpected source status '+src.cinemaId);
          }
          for(const row of d.screenings) {
            if (!dates.includes(row.sourceBusinessDate)) continue;
            const src=d.sources.find(x=>x.cinemaId===row.cinemaId);
            assert.equal(src.dateChecks.find(x=>x.date===row.sourceBusinessDate).state,'verified',
              'Published without verified source: '+row.cinemaId+' '+row.sourceBusinessDate);
          }
          const report=dates.map(day=>({
            date:day,
            screenings:d.screenings.filter(x=>x.sourceBusinessDate===day).length,
            verified:d.sources.filter(x=>x.dateChecks.some(v=>v.date===day&&v.state==='verified')).length,
            unverified:d.sources.filter(x=>x.dateChecks.some(v=>v.date===day&&v.state==='unverified')).length,
            source_error:d.sources.filter(x=>x.dateChecks.some(v=>v.date===day&&v.state==='source_error')).length
          }));
          console.log('SEVEN-DAY-SOURCE-AUDIT',JSON.stringify({checkedAt:d.checkedAt,total:d.screenings.length,report},null,2));
          assert.ok(d.screenings.length>100,'Too few validated records');
          // For the Nov 9 incident specifically, Nov 12 is already published by
          // source sites; require this actual date to be present before release.
          if(start==='2026-11-09')assert.ok(report[3].screenings>0,
            'Expected verified Nov 12 showtimes are absent despite published sources');
          NODE
