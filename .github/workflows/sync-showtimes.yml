name: Update cinema source snapshots
on:
  workflow_dispatch:
  schedule:
    # Six staggered checks every four hours (Taipei time: 00:17, 04:17,
    # 08:17, 12:17, 16:17, 20:17). GitHub cron is best-effort.
    - cron: "17 0,4,8,12,16,20 * * *"
  push:
    paths:
      - ".github/workflows/sync-showtimes.yml"
      - "scripts/sync-showtimes.cjs"
      - "scripts/audit-catalog.cjs"
      - "theater-directory.js"

permissions:
  contents: write

concurrency:
  group: movie-checker-source-sync
  cancel-in-progress: false

jobs:
  source-sync:
    # A workflow/script edit on a feature branch must never publish to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/movie-checker-deps/node_modules
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install HTML parser and UI smoke test dependencies
        run: npm install --no-save --no-audit --no-fund --prefix /tmp/movie-checker-deps turndown@7.2.0 jsdom@26.1.0
      - name: Validate source parser and coverage auditor
        run: |
          node scripts/sync-showtimes.cjs --self-test
          node scripts/audit-catalog.cjs --self-test
      - name: Preserve previous source snapshot
        run: cp catalog.json "${RUNNER_TEMP}/previous-catalog.json"
      - name: Read and validate all 38 cinema candidates (only publish verified rows)
        run: node scripts/sync-showtimes.cjs
      - name: Reject malformed, duplicate or severely regressed source data
        run: node scripts/audit-catalog.cjs --guard --previous "${RUNNER_TEMP}/previous-catalog.json"
      - name: Test all four pages with this new candidate snapshot
        run: node scripts/test-pages.cjs
      - name: Commit verified source snapshot
        shell: bash
        run: |
          # A manual GitHub update may land while we are checking the cinemas.
          # Rebase the validated snapshot on the newest main instead of losing the sync.
          cp catalog.json "${RUNNER_TEMP}/validated-catalog.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "${RUNNER_TEMP}/validated-catalog.json" catalog.json
            if git diff --quiet -- catalog.json; then
              echo "No catalog changes"
              exit 0
            fi
            git add catalog.json
            git commit -m "Refresh sourced movie showtimes"
            if git push origin HEAD:main; then
              echo "Published verified source snapshot"
              exit 0
            fi
            echo "Concurrent main update; retrying (${attempt}/3)"
          done
          echo "Failed to publish after retrying" >&2
          exit 1
      # Publishing succeeds only after fetching, hard validity checks, a real
      # four-page smoke test and a successful push. A future day not yet
      # available upstream is a SOURCE COVERAGE WARNING, not a broken sync.
      # Preserve annotations and a seven-day table in the Actions summary.
      - name: Report incomplete future-day coverage (warning only)
        run: node scripts/audit-catalog.cjs --report
