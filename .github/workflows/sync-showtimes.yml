name: Update cinema source snapshots
on:
  workflow_dispatch:
  schedule:
    # 08:00, 14:00, 20:00 and 02:00 in Taipei (UTC+8).
    - cron: "0 0,6,12,18 * * *"
  push:
    paths:
      - ".github/workflows/sync-showtimes.yml"
      - "scripts/sync-showtimes.cjs"

permissions:
  contents: write

concurrency:
  group: movie-checker-source-sync
  cancel-in-progress: false

jobs:
  source-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_PATH: /tmp/movie-checker-deps/node_modules
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install HTML-to-Markdown converter
        run: npm install --no-save --no-audit --no-fund --prefix /tmp/movie-checker-deps turndown@7.2.0
      - name: Validate source parser
        run: node scripts/sync-showtimes.cjs --self-test
      - name: Read and validate cinema listings
        run: node scripts/sync-showtimes.cjs
      - name: Commit verified source snapshot
        shell: bash
        run: |
          # A manual GitHub update may land while we are checking the cinemas.
          # Rebase the validated snapshot on the newest main instead of losing the sync.
          cp catalog.json "${RUNNER_TEMP}/validated-catalog.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "${RUNNER_TEMP}/validated-catalog.json" catalog.json
            if git diff --quiet -- catalog.json; then
              echo "No catalog changes"
              exit 0
            fi
            git add catalog.json
            git commit -m "Refresh sourced movie showtimes"
            if git push origin HEAD:main; then
              echo "Published verified source snapshot"
              exit 0
            fi
            echo "Concurrent main update; retrying (${attempt}/3)"
          done
          echo "Failed to publish after retrying" >&2
          exit 1
