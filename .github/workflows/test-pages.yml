name: Validate four-page UI
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "showtimes.html"
      - "cinemas.html"
      - "map.html"
      - "app.css"
      - "app-core.js"
      - "demo-catalog.js"
      - "movie-pages.css"
      - "movie-pages.js"
      - "theater-directory.js"
      - "catalog.json"
      - "scripts/test-pages.cjs"
      - "scripts/sync-showtimes.cjs"
      - "scripts/audit-catalog.cjs"
      - ".github/workflows/test-pages.yml"

permissions:
  contents: read

concurrency:
  group: movie-checker-ui-validation
  cancel-in-progress: true

jobs:
  ui-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_PATH: /tmp/movie-checker-ui-test/node_modules
    steps:
      - name: Checkout website
        uses: actions/checkout@v5
      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install browser DOM test dependency
        run: npm install --no-audit --no-fund --no-save --prefix /tmp/movie-checker-ui-test jsdom@26.1.0 turndown@7.2.0
      - name: Validate trusted source parsing and advertised future date discovery
        run: node scripts/sync-showtimes.cjs --self-test
      - name: Validate snapshot auditor and current catalog structure
        run: |
          node scripts/audit-catalog.cjs --self-test
          node scripts/audit-catalog.cjs --guard
      - name: Exercise Movies, Showtimes, Cinemas and Map
        run: node scripts/test-pages.cjs
